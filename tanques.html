<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Track - Tanques</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <header class="cabecalho">
        <a class="cabecalho__marca" href="index.html">
            <span class="cabecalho__logo" aria-hidden="true">🐟</span>
            <span class="cabecalho__titulo">Fish Track</span>
        </a>
        <nav class="menu" aria-label="Navegação principal">
            <a class="menu__link" href="index.html">Dashboard</a>
            <a class="menu__link" href="tanques.html" aria-current="page">Tanques</a>
            <a class="menu__link menu__link--destaque" href="registro.html">+ Registro</a>
            <a class="menu__link" href="alertas.html">Alertas</a>
            <details class="menu__mais">
                <summary class="menu__link">Mais</summary>
                <a class="menu__link" href="calendario.html">Calendário</a>
                <a class="menu__link" href="configuracoes.html">Configurações</a>
            </details>
        </nav>
    </header>

    <main class="pagina">
        <section class="secao" aria-labelledby="titulo-tanques">
            <div class="secao__cabecalho">
                <h1 class="pagina__titulo" id="titulo-tanques">Tanques</h1>
                <a class="botao botao--primario" href="tanque-form.html">Novo tanque</a>
            </div>

            <div class="campo campo--filtro">
                <label class="campo__rotulo" for="filtro-status">Status</label>
                <select class="campo__select" id="filtro-status">
                    <option value="" selected>Todos (exceto arquivados)</option>
                    <option value="ativo">Ativo</option>
                    <option value="vazio">Vazio</option>
                    <option value="manutencao">Em manutenção</option>
                    <option value="arquivado">Arquivado</option>
                </select>
            </div>

            <div class="grade-tanques" id="grade-tanques">
                <p class="grade-tanques__vazio">
                    Nenhum tanque cadastrado ainda.
                    <a class="link" href="tanque-form.html">Cadastrar o primeiro tanque</a>
                </p>
            </div>
        </section>
    </main>

    <template id="template-cartao-tanque">
        <article class="cartao-tanque">
            <div class="cartao-tanque__cabecalho">
                <h2 class="cartao-tanque__nome" data-campo="nome"></h2>
                <span class="selo" data-campo="status"></span>
            </div>

            <p class="cartao-tanque__especie" data-campo="especie"></p>

            <dl class="cartao-tanque__metricas">
                <div class="cartao-tanque__metrica">
                    <dt>Peixes</dt>
                    <dd data-campo="quantidade"></dd>
                </div>
                <div class="cartao-tanque__metrica">
                    <dt>Biomassa</dt>
                    <dd data-campo="biomassa"></dd>
                </div>
                <div class="cartao-tanque__metrica">
                    <dt>Último registro</dt>
                    <dd data-campo="ultimoRegistro"></dd>
                </div>
            </dl>

            <div class="cartao-tanque__acoes">
                <a class="link" data-campo="linkDetalhes" href="tanque.html">Ver detalhes</a>
                <a class="link" data-campo="linkEditar" href="tanque-form.html">Editar</a>
            </div>
        </article>
    </template>

    <script type="module" src="js/pages/tanques.js"></script>
</body>
</html>
