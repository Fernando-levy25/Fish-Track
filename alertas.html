<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Fish Track - Alertas</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">

</head>
<body>
    <header class="cabecalho">
        <a class="cabecalho__marca" href="index.html">
            <span class="cabecalho__logo" aria-hidden="true">🐟</span>
            <span class="cabecalho__titulo">Fish Track</span>

        <nav class="menu" aria-label="Navegação principal">
            <a class="menu__link" href="index.html">Dashboard</a>
            <a class="menu__link" href="tanques.html">Tanques</a>

            </div>

    <template id="template-grupo-alertas">

            <h2 class="grupo-alertas__titulo">
                <a class="link" data-campo="linkTanque" href="tanque.html"></a>

            <p class="grupo-alertas__especie" data-campo="especie"></p>
            <ul class="lista-alertas" data-campo="listaAlertas"></ul>

    <script type="module" src="js/pages/alertas.js"></script>
