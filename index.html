<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Track - Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho_marca">
            <span class="cabecalho_logo">🐟</span>
            <span class="cabecalho_titulo">fish track</span>
        </div>
        <nav class="menu">
            <a class="menu_link menu_link_ativo" href="index.html">Dashboard</a>
            <a class="menu_link" href="tanques.html">Tanques</a>
            <a class="menu_link" href="registro.html">Novo Registro</a>
        </nav>
    </header>

    <main class="pagina">
        <section class="pagina_secao" aria-labelledby="titulo_visao_geral">
            <h1 id="titulo_visao_geral" class="pagina_titulo">Visão geral do produto</h1>

            <div class="grade_resumo">
                <article class="cartao_metrica">
                    <p class="cartao-metrica_rotulo">tanques cadastrados</p>
                    <p class="cartao-metrica_valor" id="metrica-total-tanques">-</p>
                </article>

                <article class="cartao-metrica">
                    <p class="cartao-metrica_rotulo">biomassa total</p>
                    <p class="cartao-metrica_valor" id="metrica-biomassa-total">-</p>
                </article>

                <article class="cartao-metrica">
                    <p class="cartao-metrica_rotulo">tanques com alerta</p>
                    <p class="cartao-metrica_valor" id="metrica-tanque-alerta">-</p>
                </article>
            </div>
        </section>

        <section class="pagina_secao" aria-labelledby="titulo-alertas">
            <div class="secao_cabecalho">
                <h2 id="titulo-alertas" class="pagina_subtitulo">Alertas</h2>
                <a class="link-secao" href="tanques.html">Ver todos os Tanques</a>
            </div>

            <ul class="lista-alertas" id="lista-alertas">
                <li class="lista-alertas_vazio">Nenhum alerta no momento.</li>
            </ul>
        </section>

        <section class="pagina_secao" aria-labelledby="titulo-tanques">
            <div class="secao_cabecalho">
                <h2 id="titulo-tanques" class="pagina_subtitulo">Tanques</h2>
                <a class="botao botao-primario" href="tanques.html">Novo tanque</a>
            </div>

            <div class="grade-tanques" id="grade-tanques">
                <p class="grade-tanques_vazio">Nenhum tanque cadastrado ainda.</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
